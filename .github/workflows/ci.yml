name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check src tests
      - name: Unit and data-contract tests (no MLflow or DVC download)
        run: uv run --frozen pytest -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build inference image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: food11-api:ci
          cache-from: type=gha,scope=food11-image
          cache-to: type=gha,mode=max,scope=food11-image
      - name: Start without a model and probe health
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 -e SKIP_MODEL=1 food11-api:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8000/health | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs api || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f api || true

  push:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable code-version tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ghcr.io/paradoxghost/mlops-lab-1:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/paradoxghost/mlops-lab-1
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=food11-image
          cache-to: type=gha,mode=max,scope=food11-image
